<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="SENALingua — Technical English platform for ADSO software development apprentices at SENA">
  <meta name="theme-color" content="#f0fdf4">
  <title>SENALingua — Technical English for Software Developers</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f0fdf4' stroke='%23b9f8cf'/%3E%3Cpath d='M9 9l-3.5 7 3.5 7M23 9l3.5 7-3.5 7M19 7l-6 18' stroke='%2300a544' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col antialiased">
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-orb ambient-orb--green"></div>
    <div class="ambient-orb ambient-orb--warm"></div>
    <div class="ambient-orb ambient-orb--cool"></div>
  </div>
  <header class="global-header">
    <div class="header-container">
      <div class="header-brand">
        <button id="btn-global-back" class="btn-nav-back" data-i18n="nav.back" type="button" hidden>← Back</button>
        <span id="go-home" class="logo-brand" role="button" tabindex="0" aria-label="Go to home">
          <span class="logo-mark" aria-hidden="true">
            <svg class="logo-icon" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <rect width="32" height="32" rx="9" class="logo-icon-bg" />
              <path d="M9 9l-3.5 7 3.5 7M23 9l3.5 7-3.5 7M19 7l-6 18" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="logo-text">
            <span class="logo-bracket" aria-hidden="true">&lt;</span>SENA<span
              class="logo-accent">Lingua</span><span class="logo-bracket" aria-hidden="true">/&gt;</span>
          </span>
        </span>
      </div>
      <nav class="nav-actions" aria-label="Main navigation">
        <span class="platform-badge">
          <span data-i18n="nav.badge">ADSO · Technical English</span>
        </span>
        <button id="btn-lang-toggle" class="btn-lang-selector" type="button" aria-label="Change language">
          🇬🇧 <span class="lang-text">English (UK)</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app-root" class="flex-1 w-full" role="main" aria-live="polite"></main>
  <footer class="global-footer">
    <div class="footer-inner">
      <span class="footer-brand" aria-hidden="true">&lt;/SENALingua&gt;</span>
      <p>© 2026 SENALingua · <span data-i18n="footer.rights">All rights reserved.</span></p>
    </div>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
